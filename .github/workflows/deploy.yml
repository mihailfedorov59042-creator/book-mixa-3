name: Publish Polka PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check prepared theory materials and source references
        run: |
          python tools/build_theory_materials.py --check
          python tools/check_theory_materials.py
          python tools/check_theory_research.py
      - name: Build and test notes transfer and offline PWA updates
        env:
          POLKA_CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm test
      - name: Stage static PWA files
        run: |
          mkdir _site
          cp index.html notes-transfer.js pwa.js pwa.css manifest.webmanifest sw.js .nojekyll _site/
          cp -R data icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
